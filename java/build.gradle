plugins {
    id 'java'
}

def HOME_DIR = System.getProperty("user.home")
def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

def PZ_DIR = isWindows ? "C:/Program Files (x86)/Steam/steamapps/common/ProjectZomboid" :
    "${HOME_DIR}/Library/Application Support/Steam/steamapps/common/ProjectZomboid/Project Zomboid.app/Contents/Java"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

println "PZ_DIR: ${PZ_DIR}"
println "ZB exists: " + file("${PZ_DIR}/ZombieBuddy.jar").exists()
println "PZ exists: " + file("${PZ_DIR}/projectzomboid.jar").exists()

dependencies {
    compileOnly files("${PZ_DIR}/ZombieBuddy.jar")
    compileOnly files("${PZ_DIR}/projectzomboid.jar")
    compileOnly files("${PZ_DIR}")
    testImplementation files("${PZ_DIR}/ZombieBuddy.jar")
    testImplementation files("${PZ_DIR}/projectzomboid.jar")
    testImplementation files("${PZ_DIR}")
    testImplementation sourceSets.main.output
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
            include '**/*.java'
        }
    }
    test {
        java {
            srcDirs = ['test']
            include '**/*.java'
        }
    }
}

tasks.register('selfCheck', JavaExec) {
    dependsOn compileTestJava
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.output
    mainClass = 'me.p_menta.zb_game_perf.SelfCheck'
    jvmArgs = ['-ea']
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

check.dependsOn selfCheck
test.enabled = false

tasks.withType(JavaCompile).configureEach {
    options.annotationProcessorPath = files()
    options.generatedSourceOutputDirectory.set(provider { null })
    options.headerOutputDirectory.set(provider { null })
    options.incremental = false
}

jar {
    archiveFileName.set("ZBGamePerf.jar")
    destinationDirectory.set(file("${projectDir}/../42/media/java/client"))
}

tasks.register('deploy', Copy) {
    dependsOn jar
    def modsTarget = file("${HOME_DIR}/Zomboid [unstable]/mods/ZBGamePerf/42/media/java/client")
    from jar.archiveFile
    into modsTarget
}

tasks.named('build') {
    finalizedBy('deploy')
}
